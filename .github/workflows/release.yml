name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.93.1

jobs:
  create-release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag names Cargo.toml's version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - uses: taiki-e/create-gh-release-action@045e5c0ed9c50cc1f96de7e891a09ad3daea245f # v1.12.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  upload:
    name: ${{ matrix.target }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, features: cli }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, features: cli }
          - { target: aarch64-apple-darwin, os: macos-15, features: cli }
          - { target: x86_64-apple-darwin, os: macos-15, features: cli }
          - { target: aarch64-linux-android, os: ubuntu-22.04, features: android, android: true }
          - { target: armv7-linux-androideabi, os: ubuntu-22.04, features: android, android: true }
          - { target: x86_64-linux-android, os: ubuntu-22.04, features: android, android: true }
          - { target: i686-linux-android, os: ubuntu-22.04, features: android, android: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - run: rustup toolchain install "$RUST_VERSION" --profile minimal --target ${{ matrix.target }} && rustup default "$RUST_VERSION"
      - if: matrix.android
        id: ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r29
          add-to-path: false
      - if: matrix.android
        run: .github/android-env.sh ${{ matrix.target }} "${{ steps.ndk.outputs.ndk-path }}"
      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: sepolicy-inject-rs
          target: ${{ matrix.target }}
          features: ${{ matrix.features }}
          build-tool: cargo
          locked: true
          archive: $bin-$tag-$target
          include: LICENSE,README.md
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
