[package]
name = "sepolicy-inject-rs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "sepolicy-inject-rs"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "sepolicy"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5.53", optional = true, features = ["derive", "string"] }
cxx = "1.0.205"
pest = "2.9.5"
pest_derive = "2.9.5"
thiserror = "2.0.21"
m4rs = { optional = true, git = "https://github.com/cyberphantom52/m4rs.git", rev = "6231da923dd3e83d33d8cbdabce4070648705cb7" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }
tracing-android = { version = "0.2", optional = true }

[features]
default = ["m4"]
m4 = ["dep:m4rs"]
cli = ["m4", "dep:clap", "dep:tracing-subscriber"]
android = ["cli", "dep:tracing-android"]

[build-dependencies]
cc = "1.2.49"
cxx-build = "1.0.205"

[profile.release]
strip = true
lto = true
